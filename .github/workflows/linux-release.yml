name: Package Linux (x86_64)
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag to build and upload (blank for artifact only)
        type: string
        required: false
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  bundle:
    # Keep the glibc baseline compatible with Ubuntu 22.04 and Debian 12.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-gnu }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build Linux packages
        run: npm run bundle:linux
        env:
          # Let AppImage packaging tools run without a FUSE mount.
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Prepare and verify release assets
        run: |
          cp target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb Peer-Linux-x86_64.deb
          cp target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage Peer-Linux-x86_64.AppImage
          test "$(dpkg-deb --field Peer-Linux-x86_64.deb Architecture)" = amd64
          dpkg-deb --info Peer-Linux-x86_64.deb
          ./Peer-Linux-x86_64.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/peer
      - uses: actions/upload-artifact@v4
        with:
          name: Peer-Linux-x86_64
          path: |
            Peer-Linux-x86_64.deb
            Peer-Linux-x86_64.AppImage
          if-no-files-found: error
      - name: Upload release assets
        if: inputs.release-tag != ''
        run: gh release upload "$RELEASE_TAG" Peer-Linux-x86_64.deb Peer-Linux-x86_64.AppImage --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
