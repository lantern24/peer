name: Package macOS (Apple Silicon)
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag to build and upload (blank for artifact only)
        type: string
        required: false
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build Apple Silicon app
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npm run bundle
          test "$(lipo -archs target/aarch64-apple-darwin/release/bundle/macos/Peer.app/Contents/MacOS/peer)" = arm64
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent target/aarch64-apple-darwin/release/bundle/macos/Peer.app Peer-macOS-arm64.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Peer-macOS-arm64
          path: Peer-macOS-arm64.app.zip
          if-no-files-found: error
      - name: Upload release asset
        if: inputs.release-tag != ''
        run: gh release upload "$RELEASE_TAG" Peer-macOS-arm64.app.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
